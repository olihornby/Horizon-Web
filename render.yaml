databases:
  - name: horizon-db
    plan: free
    databaseName: horizon
    user: horizon_user

services:
  - type: web
    name: horizon-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: horizon-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: 1
