<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Horizon</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <script src="theme.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <h1 class="logo"><a class="logo-link" href="index.html">Horizon <span class="logo-home">Home</span></a></h1>
      <nav>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html" data-admin-link hidden>Admin</a>
        <button class="theme-toggle" type="button" data-theme-toggle>Light mode</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container card">
        <h3>Thank You</h3>
        <p>Your request has been submitted successfully. Our team will review it and respond within one business day.</p>
        <a class="btn" href="index.html">Return to Home</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Horizon. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      const homeLink = document.querySelector(".logo-link");
      const adminLink = document.querySelector("[data-admin-link]");

      if (!homeLink || !adminLink) {
        return;
      }

      const countKey = "horizonHomeTapCount";
      const visibleKey = "horizonAdminMenuVisible";

      function showAdminLink() {
        adminLink.hidden = false;
      }

      if (sessionStorage.getItem(visibleKey) === "1") {
        showAdminLink();
      }

      homeLink.addEventListener("click", function (event) {
        if (sessionStorage.getItem(visibleKey) === "1") {
          return;
        }

        const currentCount = Number(sessionStorage.getItem(countKey) || "0") + 1;

        if (currentCount >= 5) {
          event.preventDefault();
          sessionStorage.setItem(countKey, "0");
          sessionStorage.setItem(visibleKey, "1");
          showAdminLink();
          return;
        }

        sessionStorage.setItem(countKey, String(currentCount));
      });
    })();
  </script>
</body>
</html>
